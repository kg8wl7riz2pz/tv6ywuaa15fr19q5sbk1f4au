<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Done</title>
<style>body{font:17px/1.6 -apple-system,Segoe UI,Tahoma,sans-serif;background:#f6f7f9;color:#16181d;margin:0;padding:24px}
.c{max-width:560px;margin:auto;background:#fff;border:1px solid #e3e6eb;border-radius:14px;padding:20px}
code{display:block;direction:ltr;word-break:break-all;background:#f1f3f6;padding:10px;border-radius:8px;margin:10px 0}
button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#1f6feb;color:#fff}</style></head>
<body><div class="c"><h2>✅ تمت الموافقة</h2><p>انسخ هذا الرمز وأرسله إلى Claude (صالح لدقائق فقط):</p>
<code id="c">—</code><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent)">نسخ الرمز</button>
<p id="e" style="color:#b42318"></p></div>
<script>var q=new URLSearchParams(location.search);document.getElementById('c').textContent=q.get('code')||'—';
if(q.get('error'))document.getElementById('e').textContent='Error: '+q.get('error')+' '+(q.get('error_description')||'');</script></body></html>
